<?xml version="1.0" encoding="UTF-8"?>
<!--
  BackTrack — the app's own mark, not a drawing of it.

  Every path here is copied from the vector the app itself draws:
  app/src/main/res/drawable/ic_launcher_foreground.xml. Same 108×108 viewport, same
  geometry, same colours — green gimbal ring #00E676, navy dial face #13202F, red north
  triangle #FF1744, yellow pivot #FFC400. A gyrocompass, which is what the app is.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108"
     role="img" aria-label="BackTrack">
  <!-- Tlo ikony: ta sama granatowa plyta, co w warstwie tla adaptacyjnej ikony -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="#0A0F1A"/>

  <!-- Outer gimbal ring -->
  <path d="M54,25 a29,29 0 1,1 -0.01,0" fill="none" stroke="#00E676" stroke-width="3"/>

  <!-- Inner compass face -->
  <path d="M54,30 a24,24 0 1,1 -0.01,0" fill="#13202F"/>

  <!-- Decorative dial bezel -->
  <path d="M54,35 a19,19 0 1,1 -0.01,0" fill="none" stroke="#00E676"
        stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- Lubber-line gnomon -->
  <path d="M54,20 L51.6,25 L56.4,25 Z" fill="#00E676"/>

  <!-- North triangle -->
  <path d="M54,35 L49.2,44 L58.8,44 Z" fill="#FF1744"/>

  <!-- Cardinal ticks: E, S, W -->
  <path d="M76,54 L70,54" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54,76 L54,70" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32,54 L38,54" stroke="#00E676" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Centre pivot -->
  <circle cx="54" cy="54" r="2.8" fill="#FFC400"/>
</svg>
